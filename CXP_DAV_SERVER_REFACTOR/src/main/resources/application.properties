spring.application.name=factoraje

# Datasource configuration
spring.datasource.jndi-name=java:comp/env/jdbc/FinanciamientoCuentasDB
spring.datasource.driver-class-name=org.postgresql.Driver

#spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/postgres}
#spring.datasource.username=${DB_USERNAME:postgres}
#spring.datasource.password=${DB_PASSWORD:postgres}

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
# El esquema lo administra Flyway (src/main/resources/db/migration) en desarrollo y QA, y
# el DBA con los scripts de db/prod en producción. Hibernate solo lo valida.
#spring.jpa.hibernate.ddl-auto=validate
#spring.jpa.open-in-view=false

# Producción usa FLYWAY_ENABLED=false: si Flyway encontrara la base creada por
# db/prod/instalacion_inicial.sql, la marcaría en la versión 2 y reaplicaría V3 en adelante.
# Una base que ya tiene el esquema pero no la tabla flyway_schema_history se
# marca en la versión 2 sin ejecutar V1/V2. Una base vacía ejecuta todas las migraciones.

#spring.flyway.enabled=${FLYWAY_ENABLED:false}
#spring.flyway.locations=classpath:db/migration
#spring.flyway.baseline-on-migrate=true
#spring.flyway.baseline-version=2

# Otro ambiente de desarrollo, con la base vacía y sin migraciones. Descomentar
# estas dos líneas para que Hibernate cree y actualice el esquema. Van después de
# las propiedades de arriba, así que al activarlas las reemplazan. No usarlas en
# QA ni en producción.
#spring.jpa.hibernate.ddl-auto=update
spring.flyway.enabled=false

spring.jackson.serialization.WRITE_DATES_AS_TIMESTAMPS=false

# Zona horaria usada para la hora de corte y la fecha de desembolso
app.business-zone=America/El_Salvador

# Techo técnico de la carga. El límite que ve el usuario es el parámetro
# UPLOAD_MAX_FILE_SIZE_MB (máximo 50), que se valida en el controlador.
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# La llave HMAC del JWT es el parámetro JWT_SECRET (Base64, mínimo 256 bits).
# La duración del token es el parámetro JWT_EXPIRATION_MINUTES.

